<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:190px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div style="display:flex;gap:16px">
