<!-- @dsCard group="Brand" viewport="700x180" name="금지 사항 (Don'ts)" subtitle="Do not recolor, rotate, stretch, or place on busy fills" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:180px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.lab{font-weight:700;font-size:13px;text-align:center}.tile{display:flex;flex-direction:column;align-items:center;gap:8px}</style></head><body><div style="display:flex;gap:22px;align-items:flex-end">
<div class="tile"><img src="../assets/mascot-front.png" style="height:120px;filter:drop-shadow(var(--shadow-mascot))"><span class="lab" style="color:var(--status-success)">O 원본</span></div>
<div class="tile"><img src="../assets/mascot-front.png" style="height:120px;filter:hue-rotate(120deg)"><span class="lab" style="color:var(--status-danger)">X 색상 변경</span></div>
<div class="tile"><img src="../assets/mascot-front.png" style="height:120px;transform:rotate(-14deg)"><span class="lab" style="color:var(--status-danger)">X 회전</span></div>
<div class="tile"><img src="../assets/mascot-front.png" style="height:120px;width:150px;object-fit:fill"><span class="lab" style="color:var(--status-danger)">X 비율 왜곡</span></div>
<div class="tile"><span style="display:flex;align-items:flex-end;justify-content:center;height:120px;background:var(--teal-500)"><img src="../assets/mascot-front.png" style="height:110px"></span><span class="lab" style="color:var(--status-danger)">X 강한 배경</span></div>
</div></body></html>
