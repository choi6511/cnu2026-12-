<!-- @dsCard group="Effects" viewport="700x160" name="포커스 & 프레스 (Focus & press)" subtitle="Teal 3px ring; press shrinks to 0.97" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:160px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row" style="align-items:center;gap:20px">
<div class="sw"><div style="height:40px;display:flex;align-items:center;padding:0 20px;background:var(--navy-900);color:#fff;border-radius:var(--radius-pill);font-weight:700;font-size:15px;box-shadow:var(--shadow-focus)">포커스</div><span class="n">--shadow-focus</span></div>
<div class="sw"><div style="height:40px;display:flex;align-items:center;padding:0 20px;background:var(--action-primary-active);color:#fff;border-radius:var(--radius-pill);font-weight:700;font-size:15px;transform:scale(.97)">누름</div><span class="n">--press-scale</span></div>
<div class="sw"><div style="height:40px;display:flex;align-items:center;padding:0 20px;background:var(--action-disabled);color:var(--action-disabled-text);border-radius:var(--radius-pill);font-weight:700;font-size:15px">비활성</div><span class="n">--action-disabled</span></div>
</div></body></html>
