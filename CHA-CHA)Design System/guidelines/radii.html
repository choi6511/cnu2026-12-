<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:170px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row" style="align-items:center"><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:6px"></div><span class="n">xs · 6px</span></div><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:10px"></div><span class="n">sm · 10px</span></div><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:14px"></div><span class="n">md · 14px</span></div><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:20px"></div><span class="n">lg · 20px</span></div><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:28px"></div><span class="n">xl · 28px</span></div><div class="sw"><div style="width:76px;height:56px;background:var(--navy-050);border:2px solid var(--navy-900);border-radius:36px"></div><span class="n">2xl · 36px</span></div><div class="sw"><div style="width:110px;height:40px;background:var(--teal-500);border-radius:var(--radius-pill)"></div><span class="n">pill · 999px</span></div></div></body></html>
