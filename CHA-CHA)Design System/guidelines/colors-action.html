<!-- @dsCard group="Colors" viewport="700x170" name="액션 상태 (Action states)" subtitle="Default / hover / active / disabled for both action colors" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:170px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div class="row" style="align-items:center"><div class="sw"><div class="chip" style="height:40px;background:var(--action-primary)"></div><span class="n">primary</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--action-primary-hover)"></div><span class="n">primary-hover</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--action-primary-active)"></div><span class="n">primary-active</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--action-disabled)"></div><span class="n">disabled</span></div></div>
<div class="row" style="align-items:center"><div class="sw"><div class="chip" style="height:40px;background:var(--action-accent)"></div><span class="n">accent</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--action-accent-hover)"></div><span class="n">accent-hover</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--action-accent-active)"></div><span class="n">accent-active</span></div><div class="sw"><div class="chip" style="height:40px;background:var(--focus-ring)"></div><span class="n">focus-ring</span></div></div>
</div></body></html>
