<!-- @dsCard group="Colors" viewport="700x150" name="브랜드 팔레트 (Brand palette)" subtitle="The five canonical hex values printed on the brand sheet" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:150px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--navy-900);"></div><span class="n">--navy-900</span><span class="v">#002D72</span></div><div class="sw"><div class="chip" style="background:var(--teal-500);"></div><span class="n">--teal-500</span><span class="v">#009AB0</span></div><div class="sw"><div class="chip" style="background:var(--teal-200);"></div><span class="n">--teal-200</span><span class="v">#7ED5D8</span></div><div class="sw"><div class="chip" style="background:var(--gray-050);border:1px solid var(--border-hairline)"></div><span class="n">--gray-050</span><span class="v">#F5F5F5</span></div><div class="sw"><div class="chip" style="background:var(--blush-200);"></div><span class="n">--blush-200</span><span class="v">#FFD6D6</span></div></div></body></html>
