<!-- @dsCard group="Colors" viewport="700x150" name="텍스트 토큰 (Text tokens)" subtitle="Semantic aliases for type color" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:150px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:var(--type-subhead);color:var(--text-strong)">차차는 함께하는 친구입니다</span><span class="n">--text-strong</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font-size:15px;color:var(--text-body)">본문 텍스트는 navy-800을 사용합니다</span><span class="n">--text-body</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font-size:14px;color:var(--text-muted)">보조 설명과 캡션</span><span class="n">--text-muted</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font-size:14px;font-weight:700;color:var(--text-accent)">링크와 포인트</span><span class="n">--text-accent</span></div>
<div style="display:flex;gap:14px;align-items:center"><span style="background:var(--surface-inverse);color:var(--text-on-dark);padding:4px 12px;border-radius:var(--radius-pill);font-size:14px">네이비 위 텍스트</span><span class="n">--text-on-dark</span></div>
</div></body></html>
