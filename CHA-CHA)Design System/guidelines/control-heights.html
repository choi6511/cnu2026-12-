<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:150px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row" style="align-items:center;gap:16px"><div class="sw"><div style="height:32px;display:flex;align-items:center;padding:0 20px;background:var(--navy-900);color:#fff;border-radius:var(--radius-pill);font-weight:700;font-size:14px">자세히 보기</div><span class="n">--control-h-sm · 32px</span></div><div class="sw"><div style="height:40px;display:flex;align-items:center;padding:0 20px;background:var(--navy-900);color:#fff;border-radius:var(--radius-pill);font-weight:700;font-size:16px">자세히 보기</div><span class="n">--control-h-md · 40px</span></div><div class="sw"><div style="height:48px;display:flex;align-items:center;padding:0 20px;background:var(--navy-900);color:#fff;border-radius:var(--radius-pill);font-weight:700;font-size:18px">자세히 보기</div><span class="n">--control-h-lg · 48px</span></div></div></body></html>
