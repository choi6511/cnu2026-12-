<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:170px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row" style="align-items:center;gap:18px"><div class="sw"><div style="width:96px;height:60px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div><div class="sw"><div style="width:96px;height:60px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div><div class="sw"><div style="width:96px;height:60px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><span class="n">md</span></div><div class="sw"><div style="width:96px;height:60px;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div><div class="sw"><div style="width:96px;height:60px;background:#fff;border-radius:var(--radius-field);box-shadow:var(--shadow-inset-field);border:1px solid var(--border-hairline)"></div><span class="n">inset-field</span></div></div></body></html>
