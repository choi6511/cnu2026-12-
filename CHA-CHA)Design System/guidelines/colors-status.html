<!-- @dsCard group="Colors" viewport="700x150" name="상태 컬러 (Status)" subtitle="Info, success, warning, danger — solid and soft" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--white);font-family:var(--font-core);color:var(--text-strong);padding:20px 24px;box-sizing:border-box;height:150px}a{color:var(--teal-500)}a:hover{color:var(--teal-700)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:88px;height:56px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}.n{font-family:var(--font-mono),monospace;font-size:11px;color:var(--text-muted)}.v{font-family:var(--font-mono),monospace;font-size:10px;color:var(--gray-400)}</style></head><body><div class="row" style="align-items:center;gap:10px">
<div class="sw"><div style="display:flex;flex-direction:column;gap:6px"><span style="background:var(--status-info);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">INFO</span><span style="background:var(--teal-050);color:var(--teal-700);font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">INFO</span></div><span class="n">--status-info</span></div><div class="sw"><div style="display:flex;flex-direction:column;gap:6px"><span style="background:var(--status-success);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">SUCCESS</span><span style="background:#E4F6EF;color:#0B7357;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">SUCCESS</span></div><span class="n">--status-success</span></div><div class="sw"><div style="display:flex;flex-direction:column;gap:6px"><span style="background:var(--status-warning);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">WARNING</span><span style="background:#FCF0DE;color:#8A5A12;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">WARNING</span></div><span class="n">--status-warning</span></div><div class="sw"><div style="display:flex;flex-direction:column;gap:6px"><span style="background:var(--status-danger);color:#fff;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">DANGER</span><span style="background:#FBE6E5;color:#9A2E2A;font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--radius-pill);text-align:center">DANGER</span></div><span class="n">--status-danger</span></div>
</div></body></html>
