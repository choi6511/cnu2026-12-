<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002d72" />
    <title>최근 공지 | 차차 캠퍼스</title>
    <style>
      body { display:grid; min-height:100vh; place-items:center; margin:0; padding:20px; color:#102a43; background:#f5f5f5; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width:min(100% - 40px, 420px); padding:28px; border:2px solid #002d72; border-radius:24px; background:#fff; box-shadow:0 14px 36px rgb(0 45 114 / 13%); }
      p { color:#52667a; line-height:1.65; }
      a { display:inline-block; padding:10px 16px; border-radius:999px; color:#fff; background:#002d72; font-weight:700; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <p>차차 캠퍼스</p>
      <h1>최신 공지는 인터넷 연결이 필요해요.</h1>
      <p>연결이 돌아오면 장소별 최근 7일 공지를 다시 불러옵니다.</p>
      <a href="/">지도로 돌아가기</a>
    </main>
  </body>
</html>
