<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12355b" />
    <title>지도 연결 안내 | 차차 캠퍼스</title>
    <style>
      body { display:grid; min-height:100vh; margin:0; place-items:center; background:#eef3fa; color:#002d72; font-family:system-ui,sans-serif; }
      main { width:min(100% - 40px, 420px); padding:28px; border:2px solid #002d72; border-radius:24px; background:#fff; box-shadow:0 14px 36px rgb(0 45 114 / 13%); }
      p { color:#52667a; line-height:1.65; }
      a { display:inline-block; padding:10px 16px; border-radius:999px; color:#fff; background:#002d72; font-weight:700; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <p>차차 캠퍼스</p>
      <h1>인터넷 연결 후 지도를 확인할 수 있어요.</h1>
      <p>연결이 돌아오면 지도와 세 장소 마커를 다시 불러옵니다.</p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
